# Weekly dependency updates, one PR per app per week (minor and patch grouped),
# plus security fixes as they're published. Major breaking updates are ignored
# so they are upgraded intentionally, not automatically.
# Expo packages are left out of the app: they move together with the SDK (`npx expo install --fix`).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /pavdental
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@stripe/stripe-react-native"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /admin-dashboard
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
