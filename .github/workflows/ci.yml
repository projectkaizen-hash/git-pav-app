name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — typecheck, jest, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: pavdental
          POSTGRES_PASSWORD: pavdental_ci
          POSTGRES_DB: pavdental_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pavdental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pavdental:pavdental_ci@localhost:5432/pavdental_db?schema=public&connection_limit=5
      REDIS_URL: redis://localhost:6379
      NODE_ENV: development
      ALLOW_DEV_DEFAULTS: "1"
      PORT: "3000"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Dependency audit (high and critical, see audit-allowlist.json)
        run: node ../.github/scripts/audit-gate.mjs

      - name: Apply migrations
        run: |
          echo "CREATE EXTENSION IF NOT EXISTS postgis;" | npx prisma db execute --stdin --url "$DATABASE_URL"
          npx prisma migrate deploy

      # Fails if schema.prisma and the migration history disagree, so a
      # `db push`-only change can never land again (see docs/completion/migrations.md).
      - name: Migration drift check
        env:
          SHADOW_DATABASE_URL: postgresql://pavdental:pavdental_ci@localhost:5432/pav_shadow?schema=public
        run: |
          echo "CREATE DATABASE pav_shadow;" | npx prisma db execute --stdin --url "$DATABASE_URL"
          echo "CREATE EXTENSION IF NOT EXISTS postgis;" | npx prisma db execute --stdin --url "$SHADOW_DATABASE_URL"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Seed baseline data
        run: npm run prisma:seed

      - name: Unit tests (jest)
        run: PORT=3000 npx jest

      # postcodes.io and Daily are stubbed so the suite never depends on a
      # third-party network call (test/stubs/external-fetch.mjs).
      - name: E2E suite (mock Stripe, stubbed postcodes and Daily)
        env:
          NODE_OPTIONS: --import ./test/stubs/external-fetch.mjs
          DAILY_API_KEY: stub
        run: npm test

  docker:
    name: Backend — Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag pavdental-api:ci ./backend

  mobile:
    name: Mobile — typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pavdental
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pavdental/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Content and routing tests
        run: npm run test:all

      - name: Dependency audit (high and critical, see audit-allowlist.json)
        run: node ../.github/scripts/audit-gate.mjs

      # Checks native module versions against SDK 57 and the app config schema.
      - name: Expo doctor
        run: npx --yes expo-doctor@1.21.5

  admin-dashboard:
    name: Admin dashboard — typecheck, lint, tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (fails when findings go up, see scripts/lint-budget.mjs)
        run: npm run lint:ci

      - name: Tests
        run: npm test

      - name: Dependency audit (high and critical, see audit-allowlist.json)
        run: node ../.github/scripts/audit-gate.mjs

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  website:
    name: Website — typecheck, lint, tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No new warnings: lower the number when you fix some.
      - name: Lint
        run: npm run lint -- --max-warnings=91

      - name: Tests
        run: npm test

      - name: Dependency audit (high and critical, see audit-allowlist.json)
        run: node ../.github/scripts/audit-gate.mjs

      # `npm run build` also runs db:migrate against a live database, so CI
      # runs only the Vite build step.
      - name: Build
        run: npm exec -- node scripts/with-app-env.mjs vite build
