version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pavdental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pavdental
      POSTGRES_PASSWORD: pavdental_secure_dev_password
      POSTGRES_DB: pavdental_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavdental -d pavdental_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pavdental_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:

