# ==============================================================================
# PAV DENTAL LOCAL DEVELOPMENT COMPOSE
# WARNING: This file is strictly for local workstation development (DK-2).
# Never use this file or its committed passwords on shared hosts or production.
# All ports are bound to 127.0.0.1 (loopback) to prevent network exposure.
# ==============================================================================

version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pavdental_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pavdental
      POSTGRES_PASSWORD: pavdental_secure_dev_password
      POSTGRES_DB: pavdental_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pavdental -d pavdental_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pavdental_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: pavdental_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://pavdental:pavdental_secure_dev_password@postgres:5432/pavdental_db?schema=public
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGINS: http://localhost:8081,http://localhost:19006,exp://localhost:8081
      # STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET / DAILY_API_KEY etc. come
      # from backend/.env (mounted below) — do not hardcode secrets here.
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  redisdata:
